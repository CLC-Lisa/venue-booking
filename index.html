<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主堂｜場地使用登記</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><header><a href="./">主堂 <span>場地使用登記</span></a><small>大堂・接待室・喜樂廳</small></header>
<main><section class="intro"><p class="eyebrow">一起，讓空間成為祝福</p><h1>為下一次相聚，<br>預留一個空間。</h1><p>選擇場地與時間，規劃聚會和服事。</p></section>
<aside role="note"><strong>目前為操作示範版</strong><p>雲端資料庫尚未連接。以下登記只保存在目前瀏覽器，不會送交教會，也不代表預約成功；其他裝置無法查看。請勿填寫個人或敏感資料。</p></aside>
<section aria-labelledby="spaces"><h2 id="spaces">主堂的三個空間</h2><div class="cards"><button class="space selected" data-room="大堂" aria-pressed="true"><span>01 / MAIN HALL</span><h3>大堂</h3><p>選擇此空間 →</p></button><button class="space" data-room="接待室" aria-pressed="false"><span>02 / RECEPTION</span><h3>接待室</h3><p>選擇此空間 →</p></button><button class="space" data-room="喜樂廳" aria-pressed="false"><span>03 / JOY HALL</span><h3>喜樂廳</h3><p>選擇此空間 →</p></button></div></section>
<div class="columns"><section class="panel"><h2>試填使用登記</h2><form id="booking"><label>使用空間<select id="room"><option>大堂</option><option>接待室</option><option>喜樂廳</option></select></label><label>使用日期<input id="date" type="date" required></label><div class="times"><label>開始時間<input id="start" type="time" required></label><label>結束時間<input id="end" type="time" required></label></div><label>活動名稱（示範）<input id="purpose" maxlength="60" placeholder="例如：詩班練習" required></label><button class="primary" type="submit">儲存示範登記</button><p id="message" role="status" aria-live="polite"></p></form></section>
<section class="panel"><div class="listhead"><h2>登記月曆</h2><button id="clear" class="textbutton">清除全部</button></div><p class="muted">僅檢查此瀏覽器內的時間衝突。</p><nav class="calendar-nav" aria-label="切換月份"><button id="prev-month" type="button" aria-label="上個月">‹</button><h3 id="month-title" aria-live="polite"></h3><button id="next-month" type="button" aria-label="下個月">›</button><button id="this-month" type="button">本月</button></nav><div class="calendar-week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar" class="calendar-grid" aria-label="登記日期"></div><p class="holiday-note"><span id="holiday-status" role="status"></span><br>已收錄 2026、2027 年；<a href="https://www.dgpa.gov.tw/information?pid=12983&amp;uid=2" target="_blank" rel="noopener noreferrer">資料來源：行政院人事行政總處</a></p><h3 id="selected-date" aria-live="polite"></h3><div id="records"></div></section></div>
</main><footer>主堂場地使用登記 · 正式開放日期待公告</footer><span
  aria-label="網站版本 V3"
  style="position:fixed;right:14px;bottom:12px;z-index:10;
         padding:3px 10px;border:1px solid #d6ded4;
         border-radius:6px;background:#f7f6f1;
         color:#52665b;font-size:12px;pointer-events:none">
  V3
</span><script src="app.js?v=3"></script></body></html>
